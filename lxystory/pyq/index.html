<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星雨🌠的朋友圈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 浅灰黑底色 */
        body {
            background: #121217;
            color: #e2e2e8;
            min-height: 100vh;
        }

        /* 顶部全屏个人区域 */
        .profile-wrap {
            width: 100%;
            height: 50vh;
            position: relative;
            overflow: hidden;
        }

        .bg-full {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            filter: brightness(0.58) saturate(0.9);
        }

        /* 渐变遮罩，提升高级感 */
        .profile-mask {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, #121217, transparent);
        }

        .profile-info {
            position: absolute;
            bottom: 45px;
            left: 5%;
            right: 5%;
            display: flex;
            align-items: flex-end;
            gap: 22px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.15);
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .user-name {
            font-size: 26px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .sign-desc {
            font-size: 15px;
            color: #a8a8b8;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* 朋友圈内容区 */
        .moments {
            width: 100%;
            padding: 45px 5%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .moment-item {
            margin-bottom: 50px;
            padding-bottom: 35px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .moment-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .moment-img {
            width: 100%;
            border-radius: 14px;
            object-fit: cover;
            max-height: 72vh;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        .moment-text {
            font-size: 16px;
            color: #d0d0dc;
            margin: 18px 0 10px;
            line-height: 1.75;
        }

        .moment-time {
            font-size: 13px;
            color: #78788c;
        }

        /* 桌面端大屏适配 */
        @media (min-width: 768px) {
            .avatar {
                width: 120px;
                height: 120px;
            }
            .user-name {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部背景+个人信息 -->
    <div class="profile-wrap">
        <img class="bg-full" src="./file/bj.jpg" alt="背景图">
        <div class="profile-mask"></div>
        <div class="profile-info">
            <img class="avatar" src="./file/tx.jpg" alt="头像">
            <div class="user-box">
                <div class="user-name">L🍟</div>
                <p class="sign-desc">Light xing youth</p>
            </div>
        </div>
    </div>

    <!-- 三条朋友圈动态 -->
    <div class="moments">
        <div class="moment-item">
            <img class="moment-img" src="./file/1.jpg" alt="配图">
            <p class="moment-text">翻斗花园有棵树,我叫美女你记住!</p>
            <p class="moment-time">2026-01-25 21:07</p>
        </div>

        <div class="moment-item">
            <img class="moment-img" src="./file/2.jpg" alt="配图">
            <p class="moment-text">喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵</p>
            <p class="moment-time">2026-06-1 18:30</p>
        </div>

        <div class="moment-item">
            <img class="moment-img" src="" alt="配图">
            <p class="moment-text">??????????????????</p>
            <p class="moment-time">????-??-?? ??:??</p>
        </div>
    </div>
</body>
</html>
