<script>
const sceneNames = [
  "场景0","场景1","场景2","场景3","场景4",
  "场景5","场景6","场景7","场景8","场景9"
];
const sceneFiles = [
  "p0.jpg","p1.jpg","p2.jpg","p3.jpg","p4.jpg",
  "p5.jpg","p6.jpg","p7.jpg","p8.jpg","p9.jpg"
];

let current = 0;
let viewer = null;
let currentBlobUrl = null;
const toggleBtn = document.getElementById("toggleBtn");
const panel = document.getElementById("panel");

toggleBtn.onclick = ()=> panel.classList.toggle("show");

// 获取本机WebGL硬件最大纹理尺寸
function getDeviceMaxTexture(){
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if(!gl) return 8192;
  return gl.getParameter(gl.MAX_TEXTURE_SIZE);
}

// 下载图片，canvas缩放，返回blob临时URL
async function scaleImageToMaxSize(imgSrc, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      let targetW = img.width;
      let targetH = img.height;
      if(targetW > maxW){
        targetW = maxW;
        targetH = Math.floor(img.height * (maxW / img.width));
      }
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,targetW,targetH);
      canvas.toBlob((blob)=>{
        const url = URL.createObjectURL(blob);
        resolve(url);
      },"image/jpeg",0.85);
    };
    img.src = imgSrc;
  })
}

function renderMenu(){
  panel.innerHTML = "";
  for(let i=0;i<10;i++){
    const div = document.createElement("div");
    div.className = "menu-item";
    div.innerText = sceneNames[i];
    if(i === current) div.classList.add("active");
    div.onclick = async function(){
      current = i;
      document.querySelectorAll(".menu-item").forEach(el=>el.classList.remove("active"));
      div.classList.add("active");
      destroyViewer();
      const devMax = getDeviceMaxTexture();
      // 前端动态缩放全景图到设备允许宽度
      const scaledUrl = await scaleImageToMaxSize(sceneFiles[current], devMax);
      currentBlobUrl = scaledUrl;
      createViewer(scaledUrl);
      panel.classList.remove("show");
    }
    panel.appendChild(div);
  }
}

function destroyViewer(){
  if(viewer){
    viewer.destroy();
    viewer = null;
  }
  document.getElementById('viewer').innerHTML = '';
  // 释放内存，避免内存泄漏
  if(currentBlobUrl){
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
}

function createViewer(imgUrl){
  viewer = pannellum.viewer("viewer",{
    type:"equirectangular",
    panorama: imgUrl,
    autoLoad:true,
    showControls:false
  });
}

window.onload = async function(){
  const devMax = getDeviceMaxTexture();
  const scaledUrl = await scaleImageToMaxSize(sceneFiles[current], devMax);
  currentBlobUrl = scaledUrl;
  createViewer(scaledUrl);
  renderMenu();
};
</script>
